{{- /*
Minimal Deployment template covering all enabled substrate services.
*/ -}}
{{- $services := list
  (dict "key" "memory" "name" "memory")
  (dict "key" "retrieval" "name" "retrieval")
  (dict "key" "inference" "name" "inference")
  (dict "key" "fineTuning" "name" "fine-tuning")
  (dict "key" "eval" "name" "eval")
  (dict "key" "watchman" "name" "watchman")
  (dict "key" "localBridge" "name" "local-bridge")
-}}
{{- range $svc := $services }}
{{- $cfg := index $.Values $svc.key }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/part-of: e31-substrate
spec:
  replicas: {{ $cfg.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svc.name }}
    spec:
      runtimeClassName: {{ $.Values.global.nvidiaRuntime }}
      containers:
        - name: {{ $svc.name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $cfg.image.repository }}@{{ $cfg.image.digest }}"
          imagePullPolicy: {{ $.Values.global.pullPolicy }}
          ports:
            - containerPort: {{ $cfg.service.port }}
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: PORT
              value: "{{ $cfg.service.port }}"
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.global.namespace }}
spec:
  selector:
    app.kubernetes.io/name: {{ $svc.name }}
  ports:
    - port: {{ $cfg.service.port }}
      targetPort: {{ $cfg.service.port }}
{{- end }}
{{- end }}
